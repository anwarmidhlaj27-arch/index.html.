<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#dfe6ff;--panel:#ffffff;--ink:#17193a;--muted:#555a85;--yellow:#ffd23f;--pink:#ff5d8f;--blue:#3d6bff;--mint:#2ed3a0;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12142b;--panel:#1f2250;--ink:#f3f4ff;--muted:#a9aedd}}
:root[data-theme="dark"]{--bg:#12142b;--panel:#1f2250;--ink:#f3f4ff;--muted:#a9aedd}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif;min-height:100vh}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.wrap{max-width:820px;margin:0 auto;padding:26px 18px 50px;position:relative;z-index:1}
body{background-image:radial-gradient(circle at 15% 8%,color-mix(in srgb,var(--pink) 30%,transparent),transparent 40%),radial-gradient(circle at 88% 18%,color-mix(in srgb,var(--blue) 28%,transparent),transparent 42%),radial-gradient(circle at 50% 105%,color-mix(in srgb,var(--mint) 32%,transparent),transparent 45%),radial-gradient(color-mix(in srgb,var(--ink) 14%,transparent) 1.5px,transparent 1.5px);background-size:auto,auto,auto,22px 22px;background-attachment:fixed}
.fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fx i{position:absolute;font-style:normal;font-size:2.4rem;opacity:.22;animation:float 9s ease-in-out infinite alternate}
.fx i:nth-child(1){left:6%;top:14%}.fx i:nth-child(2){left:86%;top:10%;animation-delay:-2s;font-size:3rem}.fx i:nth-child(3){left:12%;top:72%;animation-delay:-4s}.fx i:nth-child(4){left:90%;top:62%;animation-delay:-6s}.fx i:nth-child(5){left:48%;top:88%;animation-delay:-3s;font-size:3rem}.fx i:nth-child(6){left:70%;top:34%;animation-delay:-5s}.fx i:nth-child(7){left:30%;top:6%;animation-delay:-7s}.fx i:nth-child(8){left:3%;top:42%;animation-delay:-1s;font-size:3rem}
@keyframes float{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-34px) rotate(10deg)}}
@keyframes pop{from{opacity:0;transform:translateY(26px) scale(.94)}}
@keyframes shine{to{background-position:200% center}}
@keyframes wob{30%{transform:rotate(-14deg) scale(1.15)}60%{transform:rotate(10deg) scale(1.1)}}
h1 em{font-style:normal;background:linear-gradient(100deg,var(--pink),var(--blue),var(--mint),var(--pink));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 26px}
.chips span{border:3px solid var(--ink);border-radius:999px;padding:3px 14px;background:var(--panel);font-weight:600;box-shadow:3px 3px 0 var(--ink)}
.gcard{animation:pop .55s backwards;animation-delay:calc(var(--i,0)*70ms);transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.gcard:hover{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink),0 0 36px color-mix(in srgb,var(--glow,var(--blue)) 60%,transparent)}
.gcard:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
.gcard:hover .ic{animation:wob .6s}
.stage.on{animation:pop .35s}
@media (prefers-reduced-motion:reduce){.fx i,h1 em,.gcard,.stage.on{animation:none}}
h1{font:800 clamp(2.8rem,10vw,5rem)/.95 "Bricolage Grotesque",sans-serif;letter-spacing:-.035em;margin:6px 0 8px}
h1 span{display:inline-block;background:var(--yellow);color:#17193a;padding:0 12px;border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);transform:rotate(-2deg)}
.sub{color:var(--muted);margin:14px 0 26px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.gcard{background:var(--panel);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:20px;cursor:pointer;text-align:left;transition:transform .15s,box-shadow .15s;display:grid;gap:6px}
.gcard:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
.gcard:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
.gcard .ic{width:68px;height:68px;border:3px solid var(--ink);border-radius:18px;display:grid;place-items:center;font-size:2.2rem}
.gcard h2{margin:6px 0 0;font:800 1.5rem "Bricolage Grotesque",sans-serif}
.gcard p{margin:0;color:var(--muted)}
.best{font-weight:600;margin-top:4px}
.stage{display:none}
.stage.on{display:block}.home.off{display:none}
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.top h2{margin:0;font:800 2rem "Bricolage Grotesque",sans-serif}
.btn{background:var(--yellow);color:#17193a;border:3px solid var(--ink);border-radius:14px;padding:9px 18px;font-weight:600;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.hud{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px;font-weight:600}
.hud b{font:800 1.3rem "Bricolage Grotesque",sans-serif}
.cv{position:relative;width:min(100%,360px);margin:0 auto}
canvas{width:100%;display:block;border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);touch-action:none;background:#1b1f4a}
.ovl{position:absolute;inset:0;border-radius:18px;background:rgba(23,25,58,.82);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
.ovl[hidden]{display:none}
.ovl b{font:800 2rem "Bricolage Grotesque",sans-serif}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:8px;justify-content:center;margin-top:20px}
.pad button{background:var(--panel);border:3px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink);font-size:1.2rem;cursor:pointer;touch-action:manipulation}
.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:420px;margin:0 auto}
.tile{aspect-ratio:1;border:3px solid var(--ink);border-radius:16px;background:var(--blue);color:#fff;font-size:clamp(1.8rem,9vw,2.8rem);cursor:pointer;box-shadow:4px 4px 0 var(--ink);display:grid;place-items:center;transition:transform .2s}
.tile.up{background:var(--panel);transform:rotateY(0)}
.tile.done{background:var(--mint);box-shadow:none}
.tile:not(.up):not(.done){font-size:0}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:360px;margin:0 auto}
.hole{aspect-ratio:1;border:3px solid var(--ink);border-radius:50%;background:#7a5a3a;font-size:clamp(2rem,10vw,3rem);cursor:pointer;display:grid;place-items:center;box-shadow:inset 0 8px 0 rgba(0,0,0,.35)}
.hole.on{background:var(--pink)}
.msg{text-align:center;margin-top:18px;font-weight:600;min-height:1.5em}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:330px;margin:0 auto}
.cell{aspect-ratio:1;border:3px solid var(--ink);border-radius:16px;background:var(--panel);font:800 clamp(2.4rem,14vw,3.6rem) "Bricolage Grotesque",sans-serif;cursor:pointer;box-shadow:4px 4px 0 var(--ink);color:var(--ink)}
.cell.x{color:var(--blue)}.cell.o{color:var(--pink)}.cell.w{background:var(--yellow);color:#17193a}
.g2048{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(100%,360px);margin:0 auto;padding:8px;background:var(--ink);border-radius:18px;touch-action:none}
.n{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font:800 clamp(1.2rem,6vw,1.8rem) "Bricolage Grotesque",sans-serif;background:rgba(255,255,255,.14);color:#17193a}
.simon{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(100%,320px);margin:0 auto}
.sp{aspect-ratio:1;border:3px solid var(--ink);border-radius:22px;cursor:pointer;opacity:.55;box-shadow:4px 4px 0 var(--ink);transition:opacity .1s,transform .1s}
.sp.lit{opacity:1;transform:scale(1.05);filter:brightness(1.2)}
.quiz{max-width:480px;margin:0 auto}
.quiz h3{font:800 1.5rem/1.2 "Bricolage Grotesque",sans-serif;margin:0 0 16px}
.opt{display:block;width:100%;text-align:left;margin-bottom:10px;padding:13px 16px;border:3px solid var(--ink);border-radius:14px;background:var(--panel);box-shadow:3px 3px 0 var(--ink);cursor:pointer;font-weight:600}
.opt.ok{background:var(--mint);color:#17193a}.opt.bad{background:var(--pink);color:#17193a}
@media (prefers-reduced-motion:reduce){.gcard,.tile{transition:none}}
</style>
</head>
<body>
<div class="fx" aria-hidden="true"><i>🎮</i><i>⭐</i><i>🕹️</i><i>🎲</i><i>👾</i><i>🏆</i><i>🎯</i><i>🧩</i></div>
<main class="wrap">
  <section class="home" id="home">
    <h1><span>Pocket</span> <em>Arcade</em></h1>
    <p class="sub">Quick games that play right here. Beat your best score and celebrate.</p>
    <div class="chips"><span>9 games</span><span>Saves your best scores</span><span>Works on phones</span></div>
    <div class="grid" id="grid"></div>
  </section>
  <section class="stage" id="stage">
    <div class="top"><button class="btn" id="back">← Games</button><h2 id="gname"></h2></div>
    <div id="box"></div>
  </section>
</main>

<script>
const $=id=>document.getElementById(id);
let B={};try{B=JSON.parse(localStorage.getItem("arcade-best-v1")||"{}")}catch(e){}
const setBest=(k,v,low,quiet)=>{if(B[k]==null||(low?v<B[k]:v>B[k])){B[k]=v;try{localStorage.setItem("arcade-best-v1",JSON.stringify(B))}catch(e){}if(v>0&&!quiet)confetti();return true}return false};
function confetti(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const c=document.createElement("canvas");c.width=innerWidth;c.height=innerHeight;c.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:99";document.body.appendChild(c);
  const x=c.getContext("2d"),cols=["#ffd23f","#ff5d8f","#3d6bff","#2ed3a0"];
  const P=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*15,vy:-Math.random()*13-3,s:6+Math.random()*6,c:cols[Math.random()*4|0],r:Math.random()*6}));
  let n=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.3;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++n<120)requestAnimationFrame(f);else c.remove()})();
}
let stop=()=>{};
const G=[
  {id:"snake",name:"Snake",icon:"🐍",bg:"var(--mint)",desc:"Eat apples, grow longer, don’t crash.",run:snake,fmt:v=>"Best: "+v},
  {id:"memory",name:"Memory Match",icon:"🧠",bg:"var(--yellow)",desc:"Flip cards and find all the pairs.",run:memory,fmt:v=>"Best: "+v+" moves"},
  {id:"tap",name:"Tap Rush",icon:"🎯",bg:"var(--pink)",desc:"Tap every target in 30 seconds.",run:tap,fmt:v=>"Best: "+v},
  {id:"ttt",name:"Tic-Tac-Toe",icon:"❌",bg:"var(--blue)",desc:"Beat the computer with three in a row.",run:ttt,fmt:v=>"Best: "+v+" wins"},
  {id:"g2048",name:"2048",icon:"🔢",bg:"var(--yellow)",desc:"Slide and merge tiles to reach 2048.",run:g2048,fmt:v=>"Best: "+v},
  {id:"quiz",name:"Quick Quiz",icon:"❓",bg:"var(--mint)",desc:"Eight easy questions. How many can you get?",run:quiz,fmt:v=>"Best: "+v+"/8"},
  {id:"sky",name:"Sky Hop",icon:"🐦",bg:"var(--blue)",desc:"Tap to flap and fly through the gaps.",run:sky,fmt:v=>"Best: "+v},
  {id:"brick",name:"Brick Breaker",icon:"🧱",bg:"var(--pink)",desc:"Bounce the ball and smash every brick.",run:bricks,fmt:v=>"Best: "+v},
  {id:"echo",name:"Color Echo",icon:"🎨",bg:"var(--yellow)",desc:"Watch the colors, then repeat the pattern.",run:echo,fmt:v=>"Best: round "+v}
];
function home(){
  $("grid").innerHTML="";
  G.forEach((g,idx)=>{
    const b=document.createElement("button");b.className="gcard";b.style.setProperty("--i",idx);b.style.setProperty("--glow",g.bg);
    b.onpointermove=e=>{const r=b.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;b.style.setProperty("--rx",(-py*10)+"deg");b.style.setProperty("--ry",(px*10)+"deg")};
    b.onpointerleave=()=>{b.style.setProperty("--rx","0deg");b.style.setProperty("--ry","0deg")};
    b.innerHTML=`<div class="ic" style="background:${g.bg}">${g.icon}</div><h2>${g.name}</h2><p>${g.desc}</p><div class="best">${B[g.id]!=null?g.fmt(B[g.id]):"No score yet"}</div>`;
    b.onclick=()=>{$("home").classList.add("off");$("stage").classList.add("on");$("gname").textContent=g.name;stop();g.run($("box"))};
    $("grid").appendChild(b);
  });
}
$("back").onclick=()=>{stop();stop=()=>{};$("box").innerHTML="";$("stage").classList.remove("on");$("home").classList.remove("off");home()};

function snake(box){
  box.innerHTML=`<div class="hud"><span>Score <b id="sc">0</b></span><span>Best <b id="bs">${B.snake||0}</b></span></div>
  <div class="cv"><canvas id="cv" width="320" height="320"></canvas><div class="ovl" id="ov"><b>Ready?</b><span>Arrow keys, swipe or the buttons</span><button class="btn" id="go">Start</button></div></div>
  <div class="pad"><button class="u" data-d="u" aria-label="Up">▲</button><button class="l" data-d="l" aria-label="Left">◀</button><button class="d" data-d="d" aria-label="Down">▼</button><button class="r" data-d="r" aria-label="Right">▶</button></div>`;
  const cv=$("cv"),x=cv.getContext("2d"),N=16,S=20,V={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};
  let sn,dir,nxt,food,score,t,run=false;
  const place=()=>{do{food=[Math.random()*N|0,Math.random()*N|0]}while(sn.some(p=>p[0]===food[0]&&p[1]===food[1]))};
  function start(){sn=[[8,8],[7,8],[6,8]];dir=nxt="r";score=0;$("sc").textContent=0;place();run=true;$("ov").hidden=true;clearInterval(t);t=setInterval(tick,200);draw()}
  function turn(d){const a=V[dir],b=V[d];if(a[0]+b[0]!==0||a[1]+b[1]!==0)nxt=d}
  function tick(){
    dir=nxt;const h=[sn[0][0]+V[dir][0],sn[0][1]+V[dir][1]];
    if(h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||sn.some(p=>p[0]===h[0]&&p[1]===h[1]))return over();
    sn.unshift(h);
    if(h[0]===food[0]&&h[1]===food[1]){score++;$("sc").textContent=score;place()}else sn.pop();
    draw();
  }
  function over(){
    clearInterval(t);run=false;const nb=setBest("snake",score);$("bs").textContent=B.snake||0;
    $("ov").innerHTML=`<b>Game over</b><span>Score ${score}${nb&&score?" · New best!":""}</span><button class="btn" id="go">Play again</button>`;$("ov").hidden=false;$("go").onclick=start;
  }
  function draw(){
    x.fillStyle="#1b1f4a";x.fillRect(0,0,320,320);
    x.fillStyle="#ff5d8f";x.beginPath();x.arc(food[0]*S+10,food[1]*S+10,8,0,7);x.fill();
    sn.forEach((p,i)=>{x.fillStyle=i?"#2ed3a0":"#ffd23f";x.fillRect(p[0]*S+1,p[1]*S+1,S-2,S-2)});
  }
  const key=e=>{const m={ArrowUp:"u",ArrowDown:"d",ArrowLeft:"l",ArrowRight:"r",w:"u",s:"d",a:"l",d:"r"}[e.key];if(m){e.preventDefault();if(run)turn(m)}};
  document.addEventListener("keydown",key);
  box.querySelectorAll(".pad button").forEach(b=>b.onclick=()=>run&&turn(b.dataset.d));
  let sx,sy;cv.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  cv.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(run&&Math.max(Math.abs(dx),Math.abs(dy))>20)turn(Math.abs(dx)>Math.abs(dy)?(dx>0?"r":"l"):(dy>0?"d":"u"))});
  $("go").onclick=start;
  sn=[[8,8]];food=[12,8];draw();
  stop=()=>{clearInterval(t);document.removeEventListener("keydown",key)};
}

function memory(box){
  const E=["🍕","🚀","🐼","🎸","🌈","🍩"];let cards,open,moves,found,lock;
  function start(){
    cards=[...E,...E].sort(()=>Math.random()-.5);open=[];moves=0;found=0;lock=false;
    box.innerHTML=`<div class="hud"><span>Moves <b id="mv">0</b></span><span>Best <b>${B.memory??"–"}</b></span></div><div class="mem" id="mem"></div><div class="msg" id="msg"></div>`;
    cards.forEach((c,i)=>{const b=document.createElement("button");b.className="tile";b.setAttribute("aria-label","Card "+(i+1));b.textContent=c;b.onclick=()=>flip(i,b);$("mem").appendChild(b)});
  }
  function flip(i,b){
    if(lock||b.classList.contains("up")||b.classList.contains("done"))return;
    b.classList.add("up");open.push([i,b]);
    if(open.length===2){
      moves++;$("mv").textContent=moves;lock=true;
      const [p,q]=open;
      if(cards[p[0]]===cards[q[0]]){p[1].className=q[1].className="tile done";open=[];lock=false;found++;
        if(found===E.length){const nb=setBest("memory",moves,true);$("msg").innerHTML=`You won in ${moves} moves${nb?" · New best!":""} <button class="btn" id="again">Play again</button>`;$("again").onclick=start}}
      else setTimeout(()=>{p[1].classList.remove("up");q[1].classList.remove("up");open=[];lock=false},800);
    }
  }
  start();stop=()=>{};
}

function tap(box){
  let score,left,cur,tm,sp,tt;
  box.innerHTML=`<div class="hud"><span>Score <b id="ts">0</b></span><span>Time <b id="tl">30</b></span><span>Best <b>${B.tap||0}</b></span></div><div class="holes" id="holes"></div><div class="msg" id="tmsg">Tap Start, then hit every 🎯</div><div style="text-align:center;margin-top:10px"><button class="btn" id="tgo">Start</button></div>`;
  const hs=[];for(let i=0;i<9;i++){const b=document.createElement("button");b.className="hole";b.setAttribute("aria-label","Hole "+(i+1));b.onclick=()=>{if(cur===i&&left>0){score++;$("ts").textContent=score;sp=Math.max(420,sp-18);show()}};$("holes").appendChild(b);hs.push(b)}
  function show(){clearTimeout(tm);hs.forEach(h=>{h.textContent="";h.classList.remove("on")});if(left<=0)return;let n;do{n=Math.random()*9|0}while(n===cur);cur=n;hs[n].textContent="🎯";hs[n].classList.add("on");tm=setTimeout(show,sp)}
  function end(){clearTimeout(tm);clearInterval(tt);hs.forEach(h=>{h.textContent="";h.classList.remove("on")});cur=-1;const nb=setBest("tap",score);$("tmsg").textContent=`Time’s up! Score ${score}${nb&&score?" · New best!":""}`;$("tgo").textContent="Play again";$("tgo").disabled=false}
  $("tgo").onclick=()=>{score=0;left=30;sp=900;cur=-1;$("ts").textContent=0;$("tl").textContent=30;$("tmsg").textContent="Go!";$("tgo").disabled=true;show();tt=setInterval(()=>{left--;$("tl").textContent=left;if(left<=0)end()},1000)};
  stop=()=>{clearTimeout(tm);clearInterval(tt)};
}

function ttt(box){
  let b,over,w=0,d=0,l=0;
  const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const win=s=>L.find(r=>r.every(i=>b[i]===s));
  const cells=()=>[...$("ttt").children];
  function paint(wl){cells().forEach((c,i)=>{c.textContent=b[i];c.className="cell "+b[i].toLowerCase()+(wl&&wl.includes(i)?" w":"")})}
  function start(){
    b=Array(9).fill("");over=false;
    box.innerHTML=`<div class="hud"><span>Wins <b>${w}</b></span><span>Draws <b>${d}</b></span><span>Losses <b>${l}</b></span><span>Best <b>${B.ttt||0}</b></span></div><div class="ttt" id="ttt"></div><div class="msg" id="tm">You are X. Your move.</div>`;
    b.forEach((_,i)=>{const c=document.createElement("button");c.className="cell";c.setAttribute("aria-label","Square "+(i+1));c.onclick=()=>play(i);$("ttt").appendChild(c)});
  }
  function finish(){
    over=true;const x=win("X"),o=win("O");paint(x||o);let m;
    if(x){w++;setBest("ttt",w);m="You win! 🎉"}else if(o){l++;m="Computer wins."}else{d++;m="It’s a draw."}
    $("tm").innerHTML=`${m} <button class="btn" id="nx">Next round</button>`;$("nx").onclick=start;
  }
  function cpu(){
    const free=b.map((v,i)=>v?-1:i).filter(i=>i>=0);
    const tryFor=s=>free.find(i=>{b[i]=s;const r=win(s);b[i]="";return r});
    let m=tryFor("O");if(m==null)m=tryFor("X");
    if(m==null&&free.includes(4))m=4;
    if(m==null||Math.random()<.25)m=free[Math.random()*free.length|0];
    b[m]="O";
  }
  function play(i){
    if(over||b[i])return;
    b[i]="X";paint();if(win("X")||!b.includes(""))return finish();
    cpu();paint();if(win("O")||!b.includes(""))finish();
  }
  start();stop=()=>{};
}

function g2048(box){
  let g,score,over;
  const col=v=>`hsl(${Math.max(0,48-Math.log2(v)*4)} 90% ${78-Math.log2(v)*2.5}%)`;
  const add=()=>{const e=[];g.forEach((r,i)=>r.forEach((v,j)=>{if(!v)e.push([i,j])}));if(e.length){const p=e[Math.random()*e.length|0];g[p[0]][p[1]]=Math.random()<.9?2:4}};
  function slide(line){const a=line.filter(v=>v);let s=0;for(let i=0;i<a.length-1;i++)if(a[i]===a[i+1]){a[i]*=2;s+=a[i];a.splice(i+1,1)}while(a.length<4)a.push(0);return[a,s]}
  function start(){g=Array.from({length:4},()=>Array(4).fill(0));score=0;over=false;add();add();draw()}
  function draw(){
    box.innerHTML=`<div class="hud"><span>Score <b>${score}</b></span><span>Best <b>${B.g2048||0}</b></span></div><div class="g2048" id="gb"></div><div class="msg" id="gm">Swipe or use the arrow keys</div><div class="pad"><button class="u" data-d="u" aria-label="Up">▲</button><button class="l" data-d="l" aria-label="Left">◀</button><button class="d" data-d="d" aria-label="Down">▼</button><button class="r" data-d="r" aria-label="Right">▶</button></div>`;
    g.flat().forEach(v=>{const c=document.createElement("div");c.className="n";if(v){c.textContent=v;c.style.background=col(v)}$("gb").appendChild(c)});
    box.querySelectorAll(".pad button").forEach(b=>b.onclick=()=>move(b.dataset.d));
    bindSwipe();
    if(over){$("gm").innerHTML=`Game over · Score ${score} <button class="btn" id="rs">Play again</button>`;$("rs").onclick=start}
  }
  function move(d){
    if(over)return;let moved=false,gain=0;const hz=d==="l"||d==="r",rev=d==="r"||d==="d";
    for(let i=0;i<4;i++){
      let line=[];for(let j=0;j<4;j++)line.push(hz?g[i][j]:g[j][i]);
      if(rev)line.reverse();
      let[n,s]=slide(line);gain+=s;if(rev)n.reverse();
      for(let j=0;j<4;j++){const r=hz?i:j,c=hz?j:i;if(g[r][c]!==n[j]){moved=true;g[r][c]=n[j]}}
    }
    if(!moved)return;
    score+=gain;add();setBest("g2048",score,false,true);
    const can=g.some((r,i)=>r.some((v,j)=>!v||(j<3&&v===r[j+1])||(i<3&&v===g[i+1][j])));
    if(!can)over=true;
    draw();
  }
  let sx,sy;
  function bindSwipe(){const el=$("gb");el.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
    el.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>20)move(Math.abs(dx)>Math.abs(dy)?(dx>0?"r":"l"):(dy>0?"d":"u"))})}
  const key=e=>{const m={ArrowUp:"u",ArrowDown:"d",ArrowLeft:"l",ArrowRight:"r"}[e.key];if(m){e.preventDefault();move(m)}};
  document.addEventListener("keydown",key);
  start();stop=()=>document.removeEventListener("keydown",key);
}

function quiz(box){
  const Q=[["Which is the largest planet in our solar system?","Jupiter","Mars","Venus","Saturn"],
   ["What is the capital of Japan?","Tokyo","Osaka","Kyoto","Seoul"],
   ["How many continents are there?","7","5","6","8"],
   ["What is the fastest land animal?","Cheetah","Lion","Horse","Tiger"],
   ["What is the national animal of India?","Tiger","Lion","Elephant","Peacock"],
   ["Which gas do plants take in from the air?","Carbon dioxide","Oxygen","Nitrogen","Helium"],
   ["Which is the largest ocean?","Pacific","Atlantic","Indian","Arctic"],
   ["Who painted the Mona Lisa?","Leonardo da Vinci","Picasso","Van Gogh","Monet"],
   ["What is the smallest prime number?","2","1","3","0"],
   ["How many sides does a hexagon have?","6","5","7","8"]];
  let qs,i,sc;
  function start(){qs=Q.slice().sort(()=>Math.random()-.5).slice(0,8);i=0;sc=0;show()}
  function show(){
    if(i>=qs.length){const nb=setBest("quiz",sc);box.innerHTML=`<div class="quiz"><h3>You scored ${sc} out of ${qs.length}${nb&&sc?" · New best!":""}</h3><button class="btn" id="qa">Play again</button></div>`;$("qa").onclick=start;return}
    const q=qs[i],ans=q[1],opts=q.slice(1).sort(()=>Math.random()-.5);
    box.innerHTML=`<div class="quiz"><div class="hud"><span>Question <b>${i+1}</b>/${qs.length}</span><span>Score <b>${sc}</b></span></div><h3></h3><div id="os"></div></div>`;
    box.querySelector("h3").textContent=q[0];
    opts.forEach(o=>{const b=document.createElement("button");b.className="opt";b.textContent=o;
      b.onclick=()=>{[...$("os").children].forEach(x=>{x.disabled=true;if(x.textContent===ans)x.classList.add("ok")});if(o===ans)sc++;else b.classList.add("bad");setTimeout(()=>{i++;show()},900)};
      $("os").appendChild(b)});
  }
  start();stop=()=>{};
}

function sky(box){
  box.innerHTML=`<div class="hud"><span>Score <b id="sc">0</b></span><span>Best <b id="bs">${B.sky||0}</b></span></div><div class="cv"><canvas id="cv" width="320" height="420"></canvas><div class="ovl" id="ov"><b>Sky Hop</b><span>Tap, click or press Space to flap</span><button class="btn" id="go">Start</button></div></div>`;
  const cv=$("cv"),x=cv.getContext("2d");let by=200,vy=0,pipes=[],f=0,score=0,t,run=false;
  function start(){by=200;vy=0;pipes=[];f=0;score=0;$("sc").textContent=0;run=true;$("ov").hidden=true;clearInterval(t);t=setInterval(step,16);draw()}
  const flap=()=>{if(run)vy=-5.2};
  function over(){clearInterval(t);run=false;const nb=setBest("sky",score);$("bs").textContent=B.sky||0;$("ov").innerHTML=`<b>Game over</b><span>Score ${score}${nb&&score?" · New best!":""}</span><button class="btn" id="go">Play again</button>`;$("ov").hidden=false;$("go").onclick=start}
  function step(){
    f++;vy+=.28;by+=vy;
    if(f%95===1)pipes.push({x:320,g:60+Math.random()*200,p:false});
    pipes.forEach(p=>p.x-=2.2);pipes=pipes.filter(p=>p.x>-50);
    for(const p of pipes){
      if(!p.p&&p.x+44<80){p.p=true;score++;$("sc").textContent=score}
      if(91>p.x&&69<p.x+44&&(by-11<p.g||by+11>p.g+120))return over();
    }
    if(by>409||by<-20)return over();
    draw();
  }
  function draw(){
    const g=x.createLinearGradient(0,0,0,420);g.addColorStop(0,"#5aa9ff");g.addColorStop(1,"#bfe3ff");x.fillStyle=g;x.fillRect(0,0,320,420);
    x.fillStyle="rgba(255,255,255,.7)";[[40,60],[200,110],[120,260]].forEach(c=>{x.beginPath();x.arc(c[0],c[1],18,0,7);x.arc(c[0]+20,c[1]+4,14,0,7);x.arc(c[0]-18,c[1]+5,12,0,7);x.fill()});
    pipes.forEach(p=>{x.fillStyle="#2ed3a0";x.strokeStyle="#17193a";x.lineWidth=3;x.fillRect(p.x,-4,44,p.g+4);x.strokeRect(p.x,-4,44,p.g+4);x.fillRect(p.x,p.g+120,44,320);x.strokeRect(p.x,p.g+120,44,320)});
    x.fillStyle="#ffd23f";x.beginPath();x.arc(80,by,11,0,7);x.fill();x.stroke();
    x.fillStyle="#17193a";x.beginPath();x.arc(84,by-3,2.5,0,7);x.fill();
    x.fillStyle="#ff5d8f";x.fillRect(88,by+1,9,4);
  }
  const key=e=>{if(e.code==="Space"||e.key==="ArrowUp"){e.preventDefault();flap()}};
  document.addEventListener("keydown",key);cv.addEventListener("pointerdown",flap);$("go").onclick=start;draw();
  stop=()=>{clearInterval(t);document.removeEventListener("keydown",key)};
}

function bricks(box){
  box.innerHTML=`<div class="hud"><span>Score <b id="sc">0</b></span><span>Lives <b id="lv">3</b></span><span>Best <b id="bs">${B.brick||0}</b></span></div><div class="cv"><canvas id="cv" width="320" height="400"></canvas><div class="ovl" id="ov"><b>Brick Breaker</b><span>Move your finger, mouse or arrow keys</span><button class="btn" id="go">Start</button></div></div>`;
  const cv=$("cv"),x=cv.getContext("2d"),PW=64,CL=["#ff5d8f","#ffd23f","#2ed3a0","#3d6bff","#b86bff"];
  let px=128,bx,by,dx,dy,br=[],sc=0,lives=3,t,run=false;
  const ball=()=>{bx=160;by=340;dx=2.6*(Math.random()<.5?-1:1);dy=-3.2};
  function start(){br=[];for(let r=0;r<5;r++)for(let c=0;c<7;c++)br.push({x:c*44+6,y:r*20+40,a:true,r});sc=0;lives=3;px=128;ball();$("sc").textContent=0;$("lv").textContent=3;run=true;$("ov").hidden=true;clearInterval(t);t=setInterval(step,16);draw()}
  function over(won){clearInterval(t);run=false;const nb=setBest("brick",sc);$("bs").textContent=B.brick||0;$("ov").innerHTML=`<b>${won?"You cleared it! 🎉":"Game over"}</b><span>Score ${sc}${nb&&sc?" · New best!":""}</span><button class="btn" id="go">Play again</button>`;$("ov").hidden=false;$("go").onclick=start}
  function step(){
    bx+=dx;by+=dy;
    if(bx<6||bx>314)dx=-dx;if(by<6)dy=-dy;
    if(dy>0&&by>372&&by<388&&bx>px-4&&bx<px+PW+4){dy=-Math.abs(dy);dx=((bx-px)/PW-.5)*7}
    for(const b of br){if(b.a&&bx>b.x&&bx<b.x+40&&by>b.y&&by<b.y+16){b.a=false;dy=-dy;sc+=10;$("sc").textContent=sc;break}}
    if(by>410){lives--;$("lv").textContent=lives;if(lives<=0)return over(false);ball()}
    if(!br.some(b=>b.a))return over(true);
    draw();
  }
  function draw(){
    x.fillStyle="#1b1f4a";x.fillRect(0,0,320,400);
    br.forEach(b=>{if(b.a){x.fillStyle=CL[b.r];x.fillRect(b.x,b.y,40,16)}});
    x.fillStyle="#ffd23f";x.fillRect(px,380,PW,10);
    x.fillStyle="#fff";x.beginPath();x.arc(bx,by,6,0,7);x.fill();
  }
  const clamp=v=>Math.max(0,Math.min(320-PW,v));
  cv.addEventListener("pointermove",e=>{const r=cv.getBoundingClientRect();px=clamp((e.clientX-r.left)/r.width*320-PW/2)});
  const key=e=>{if(e.key==="ArrowLeft"){e.preventDefault();px=clamp(px-24)}if(e.key==="ArrowRight"){e.preventDefault();px=clamp(px+24)}};
  document.addEventListener("keydown",key);$("go").onclick=start;ball();draw();
  stop=()=>{clearInterval(t);document.removeEventListener("keydown",key)};
}

function echo(box){
  const C=["#ff5d8f","#ffd23f","#2ed3a0","#3d6bff"];let seq=[],pos=0,lock=true,to=[];
  box.innerHTML=`<div class="hud"><span>Round <b id="rd">0</b></span><span>Best <b>${B.echo||0}</b></span></div><div class="simon" id="sm"></div><div class="msg" id="em">Press Start and watch the pattern</div><div style="text-align:center;margin-top:10px"><button class="btn" id="eg">Start</button></div>`;
  const pads=C.map((c,i)=>{const b=document.createElement("button");b.className="sp";b.style.background=c;b.setAttribute("aria-label","Color "+(i+1));b.onclick=()=>press(i);$("sm").appendChild(b);return b});
  const later=(f,ms)=>to.push(setTimeout(f,ms));
  const light=(i,ms)=>{pads[i].classList.add("lit");later(()=>pads[i].classList.remove("lit"),ms)};
  function next(){
    seq.push(Math.random()*4|0);pos=0;lock=true;$("rd").textContent=seq.length;$("em").textContent="Watch...";
    seq.forEach((s,k)=>later(()=>light(s,420),700+k*650));
    later(()=>{lock=false;$("em").textContent="Your turn"},700+seq.length*650);
  }
  function press(i){
    if(lock)return;light(i,180);
    if(i!==seq[pos]){lock=true;const r=seq.length-1;const nb=setBest("echo",r);$("em").textContent=`Wrong! You reached round ${r}${nb&&r?" · New best!":""}`;$("eg").textContent="Play again";return}
    pos++;
    if(pos===seq.length){lock=true;setBest("echo",seq.length,false,true);$("em").textContent="Nice!";later(next,900)}
  }
  $("eg").onclick=()=>{to.forEach(clearTimeout);to=[];seq=[];$("eg").textContent="Restart";next()};
  stop=()=>{to.forEach(clearTimeout)};
}
home();
